<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows Calculator</title>
  <style>
    body {
      font-family: Segoe UI, sans-serif;
      display: flex;
      justify-content: center;
      margin-top: 50px;
      background: #f5f5f5;
    }
    .calculator {
      background: #ffffff;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      padding: 20px;
      border-radius: 8px;
      width: 280px;
    }
    #result {
      width: 100%;
      height: 50px;
      margin-bottom: 15px;
      text-align: right;
      font-size: 24px;
      border: none;
      background: #f0f0f0;
      padding: 8px;
      border-radius: 4px;
    }
    button {
      width: 60px;
      height: 40px;
      margin: 5px;
      font-size: 18px;
      background: #e6e6e6;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #d0d0d0;
    }
    .links {
      margin-top: 15px;
      text-align: center;
    }
    .links a {
      margin: 0 5px;
      text-decoration: none;
      color: #0066cc;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="result" disabled><br>
    <button onclick="clearResult()">C</button>
    <button onclick="appendValue('/')">/</button>
    <button onclick="appendValue('*')">*</button>
    <button onclick="appendValue('-')">-</button><br>
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('+')">+</button><br>
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="calculate()">=</button><br>
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue('0')">0</button>

    <div class="links">
      <a href="TI-30.html">TI-30 Theme</a> |
      <a href="calculator-old.html">Old Theme</a> |
      <a href="calculator-default.html">Default Theme</a>
    </div>
  </div>

  <script>
    function appendValue(val) {
      document.getElementById("result").value += val;
    }
    function clearResult() {
      document.getElementById("result").value = "";
    }
    function calculate() {
      try {
        document.getElementById("result").value = eval(document.getElementById("result").value);
      } catch {
        document.getElementById("result").value = "Error";
      }
    }
  </script>
</body>
</html>
